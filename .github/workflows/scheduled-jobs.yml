name: Scheduled quiz maintenance

on:
  schedule:
    # Hourly. GitHub may delay a cron run by a few minutes under load; that's
    # fine here since neither job needs to-the-minute precision.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  run-maintenance-commands:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py delete_expired_quizzes
      - run: python manage.py expire_stale_attempts
